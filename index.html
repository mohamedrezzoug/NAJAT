<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c81e1e">
<meta name="description" content="نجاة: دليلك للسلامة وقت الطوارئ، يعمل دون إنترنت">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>NAJAT نجاة</title>
<style>
@font-face{font-family:'Cairo';src:url('fonts/Cairo.ttf') format('truetype');font-weight:200 1000;font-display:swap}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one calm column (max 760px) — a red SOS block on top, hazard tiles, preparation tools; fixed bottom tabs. */
:root{
 --bg:#eef2f4;--surface:#ffffff;--surface2:#f6f8f9;--ink:#0d1b26;--muted:#556472;--line:#d6dee4;
 --sos:#c81e1e;--sos2:#a01414;--sosInk:#ffffff;--accent:#0b6466;--ok:#15803d;--bad:#b91c1c;--badBg:#fdecec;--read:#fff4c2;
 --font:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;
 --r:18px;--shadow:0 1px 2px rgba(13,27,38,.06),0 6px 18px rgba(13,27,38,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1117;--surface:#141c24;--surface2:#1a242e;--ink:#e7eef3;--muted:#98a8b6;--line:#26323d;--sos:#e03131;--sos2:#b52222;--sosInk:#ffffff;--accent:#38c5c0;--ok:#4ade80;--bad:#f87171;--badBg:#3a1d20;--read:#4a3f12;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1117;--surface:#141c24;--surface2:#1a242e;--ink:#e7eef3;--muted:#98a8b6;--line:#26323d;--sos:#e03131;--sos2:#b52222;--sosInk:#ffffff;--accent:#38c5c0;--ok:#4ade80;--bad:#f87171;--badBg:#3a1d20;--read:#4a3f12;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
html[data-size="2"]{font-size:112%}html[data-size="3"]{font-size:126%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{width:1.35em;height:1.35em;flex:none}.ic.big{width:2.2em;height:2.2em}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mark{width:40px;height:40px;border-radius:12px;background:var(--sos);color:#fff;display:grid;place-items:center;flex:none}
.brand{flex:1;min-width:0;line-height:1.2}
.brand b{display:block;font-weight:900;font-size:1.2rem;letter-spacing:.02em}
.brand b span{color:var(--muted);font-weight:700}
.brand small{display:block;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{border:1px solid var(--line);background:var(--surface2);border-radius:12px;min-width:44px;height:44px;display:grid;place-items:center;font-weight:800;font-size:.85rem;padding:0 8px}
.offbar{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);padding-bottom:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#netDot{width:8px;height:8px;border-radius:50%;background:var(--ok)}#netDot[data-on="false"]{background:#f59f00}
main{max-width:760px;margin:0 auto;padding-block:14px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
section{display:flex;flex-direction:column;gap:10px}
.sh{font-size:1.05rem;font-weight:800;margin:6px 0 0;display:flex;align-items:center;gap:8px;text-wrap:balance}
.sh.red{color:var(--bad)}
.ph{font-size:1.5rem;font-weight:900;margin:0;text-wrap:balance}
/* SOS */
.sosbox{gap:10px}
.sosbtn{position:relative;overflow:hidden;border:0;border-radius:24px;background:linear-gradient(160deg,var(--sos),var(--sos2));color:var(--sosInk);display:flex;align-items:center;gap:16px;padding:22px 20px;text-align:start;box-shadow:0 10px 24px rgba(200,30,30,.28);min-height:118px}
.sosbtn b{display:block;font-size:1.7rem;font-weight:900;line-height:1.15}
.sosbtn small{display:block;opacity:.92;font-size:.92rem;font-weight:600;margin-top:4px}
.pulse{position:absolute;inset-inline-start:22px;top:50%;width:52px;height:52px;margin-top:-26px;border-radius:50%;background:rgba(255,255,255,.25);animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.3}}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick .qbtn{flex-direction:column;gap:4px;font-size:.85rem;text-align:center;line-height:1.25;min-height:76px}
.qbtn.alarmq{background:#1f1300;color:#ffd43b;border-color:#1f1300}
.alarmbig{border:0;border-radius:18px;background:#1f1300;color:#ffd43b;display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:start;min-height:70px}
.alarmbig .ic{width:34px;height:34px;flex:none}.alarmbig b{display:block;font-size:1.15rem;font-weight:900}.alarmbig small{display:block;color:#f5e6b0;font-size:.85rem;font-weight:600}
.alarmbig.slim{min-height:58px;justify-content:center}
#alarm{position:fixed;inset:0;z-index:100;background:#b00000;color:#fff;overflow-y:auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.alarm-on{overflow:hidden}body.alarm-on #tabs,body.alarm-on #speakbar{display:none}
body.alarm-flash #alarm{animation:alflash 1s steps(1) infinite}
@keyframes alflash{0%{background:#c40000}50%{background:#2a0000}}
@media (prefers-reduced-motion:reduce){body.alarm-flash #alarm{animation:none}}
#alarmBody{flex:1;max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;padding-block:20px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.alsos{font-size:clamp(4.5rem,24vw,9rem);font-weight:900;line-height:.95;letter-spacing:.06em}
.alhelp{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;font-size:clamp(1.15rem,5vw,1.7rem);font-weight:900;line-height:1.3}
.alsub{margin:0;font-weight:700;font-size:1.05rem;opacity:.95}
.alpos{background:rgba(0,0,0,.35);border-radius:18px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;width:100%}
.alpos b{font-size:clamp(1.3rem,6vw,2rem);font-variant-numeric:tabular-nums;direction:ltr}.alpos small{opacity:.85;font-weight:700}
.alrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.albtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#fff;color:#8a0000;border-radius:16px;min-height:72px;padding:8px;text-decoration:none;font-weight:800}
.albtn .ic{width:28px;height:28px}
.alfam{display:flex;flex-direction:column;gap:6px;width:100%;background:rgba(0,0,0,.25);border-radius:16px;padding:10px}.alfam small{opacity:.85;font-weight:700}.alfam a{color:#fff;font-weight:800;font-size:1.05rem}
.alopts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.alopts button{border:2px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;padding:8px 14px;font-weight:800;min-height:44px}
.alopts button[aria-pressed="true"]{background:#fff;color:#8a0000;border-color:#fff}
.altip{margin:0;font-weight:700;opacity:.9;font-size:.9rem}
#alStop{position:relative;overflow:hidden;margin:0 auto 14px;width:min(560px,calc(100% - 32px));min-height:72px;border:0;border-radius:20px;background:#fff;color:#000;font-weight:900;font-size:1.15rem;touch-action:none;user-select:none;-webkit-user-select:none}
#alStopProg{position:absolute;inset:0 auto 0 0;width:0;background:#ffd43b}
#alStop span{position:relative}
.qbtn{border:1px solid var(--line);background:var(--surface);border-radius:16px;min-height:60px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;padding:8px 10px;color:var(--sos)}
/* hazard tiles */
.hzgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.hzgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hz{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:start;min-height:120px;box-shadow:var(--shadow)}
.hzi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.hzi .ic{width:28px;height:28px}
.hzt b{display:block;font-weight:800;font-size:1rem;line-height:1.3}
.hzt small{display:block;color:var(--muted);font-size:.8rem;line-height:1.35;margin-top:2px}
.hz.big{min-height:104px;border-width:2px;border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.hz.big b{font-size:1.08rem}
.sostop{display:flex;align-items:center;gap:12px;color:var(--sos)}
.sostop h1{margin:0;font-size:1.6rem;font-weight:900}
/* tools */
.tools{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.tools{grid-template-columns:1fr 1fr}}
.tool{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:flex-start;text-align:start;min-height:76px}
.tool>.ic{width:30px;height:30px;color:var(--accent);margin-top:2px}
.tool span{min-width:0;flex:1}.tool b{display:block;font-weight:800}.tool small{display:block;color:var(--muted);font-size:.85rem}
.tool.aid{background:color-mix(in srgb,#be123c 8%,var(--surface));border-color:color-mix(in srgb,#be123c 35%,var(--line))}.tool.aid>.ic{color:#be123c}
.meter{display:block;height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}.meter>i{display:block;height:100%;background:var(--ok);border-radius:9px}
.fine{color:var(--muted);font-size:.82rem;margin:0}
.note{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:.9rem;margin:0;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.note .ic{color:var(--accent);margin-top:2px}
/* headers */
.hzhead,.nowhead{display:flex;gap:14px;align-items:center;border-radius:22px;padding:16px;background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line))}
.hzhead h1,.nowhead h1{margin:0;font-size:1.45rem;font-weight:900;line-height:1.2;text-wrap:balance}
.hzhead p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.nowhead small{display:block;color:var(--c);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem}
.hzhead .hzi,.nowhead .hzi{width:60px;height:60px;background:var(--surface)}
.hzhead .hzi .ic,.nowhead .hzi .ic{width:34px;height:34px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.88rem;max-width:72vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs .tbad{color:var(--bad)}.tabs .tbad[aria-selected="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bar h2{margin:0;font-size:1.1rem;font-weight:800;flex:1;min-width:0;text-wrap:balance}
/* steps */
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;position:relative;transition:background .2s}
.step .pic{font-size:2.1rem;width:58px;height:58px;flex:none;display:grid;place-items:center;background:var(--surface2);border-radius:14px;line-height:1}
.step p{margin:0;flex:1;min-width:0;font-size:1.05rem;font-weight:600;line-height:1.5}
.step .n{position:absolute;top:-8px;inset-inline-start:-6px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums}
.step .say{flex:none;width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;color:var(--accent)}
.step.bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line));background:var(--badBg)}
.step.bad .pic{background:var(--surface)}
.step.reading{background:var(--read);border-color:#e0b100}
.nowlist .step p{font-size:1.15rem;font-weight:700}
/* buttons */
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;min-height:48px;padding:8px 14px;display:inline-flex;align-items:center;gap:8px;font-weight:700;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.play{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.mini{border:1px solid var(--line);background:var(--surface2);border-radius:10px;min-height:40px;min-width:40px;padding:4px 10px;font-weight:700;font-size:.85rem;display:inline-grid;place-items:center}
.wide{border:1px dashed var(--line);background:transparent;border-radius:var(--r);min-height:56px;font-weight:800;color:var(--accent);display:flex;align-items:center;justify-content:center;gap:8px;padding:8px}
.link{border:0;background:none;color:var(--accent);font-weight:700;text-decoration:underline;padding:8px 0;align-self:flex-start}.link.danger{color:var(--bad)}
.calls{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:560px){.calls{grid-template-columns:1fr 1fr}}
.callbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;min-height:60px}
.callbtn .cl{display:flex;align-items:center;gap:10px;min-width:0;font-weight:700}
.callbtn .cl .ic{color:var(--sos)}
.callbtn .num{font-size:1.35rem;font-weight:900;font-variant-numeric:tabular-nums;direction:ltr;color:var(--sos)}
.callbtn.big{border:2px solid color-mix(in srgb,var(--sos) 40%,var(--line));min-height:68px}
.cchead{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.cchead b{display:block;font-size:1.15rem;font-weight:800}.cchead small{display:block;color:var(--muted);font-size:.85rem}.cchead div{min-width:0}
.flagcc{flex:none;min-width:52px;height:52px;padding:0 6px;border-radius:14px;background:var(--sos);color:#fff;display:grid;place-items:center;font-weight:900;font-size:1.1rem;letter-spacing:.04em}
/* location */
.locbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.lochead{display:flex;align-items:center;gap:8px}.lochead b{flex:1}.lochead .ic{color:var(--accent)}
.coords{margin:0;font-weight:800;font-size:1.1rem;direction:ltr;text-align:start;font-variant-numeric:tabular-nums;word-break:break-word}
html[dir="rtl"] .coords{text-align:right}
.coords small{font-weight:600;color:var(--muted);font-size:.8rem}
.nearest{display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:14px;padding:10px}
.nearest>span:first-child{font-size:1.8rem}.nearest div{flex:1;min-width:0}.nearest small{display:block;color:var(--muted);font-size:.8rem}
.dirw{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px}
.dir{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--bg);transform:rotate(var(--r,0deg));transition:transform .3s}
.dir .ic{width:24px;height:24px;fill:currentColor}
.dd{font-variant-numeric:tabular-nums;font-size:.9rem;direction:ltr}
/* cards/forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:8px}
.card p{margin:0}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld span{font-size:.85rem;font-weight:700;color:var(--muted)}
input,select{border:1px solid var(--line);background:var(--surface2);border-radius:12px;min-height:48px;padding:8px 12px;width:100%;min-width:0}
.row input{flex:1;width:auto;min-width:160px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.pin{letter-spacing:.4em;text-align:center;font-size:1.3rem;max-width:240px}
.lockcard{align-items:center;text-align:center}.lockcard .ic.big{color:var(--accent)}
.err{color:var(--bad);font-weight:700;margin:0}
.empty{color:var(--muted);margin:0;padding:12px;border:1px dashed var(--line);border-radius:14px;text-align:center}
.member .mh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.member .mh b{font-size:1.1rem}.member .mh small{color:var(--muted)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:.95rem}dt{color:var(--muted);font-weight:700}dd{margin:0;min-width:0;word-break:break-word}
.confirm{background:var(--badBg);border:1px solid var(--bad);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
/* kit */
.kitsum{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:4px 10px}.kitsum b{font-size:2rem;font-weight:900;font-variant-numeric:tabular-nums}.kitsum .meter{grid-column:1/-1;height:10px}
.checks{display:flex;flex-direction:column;gap:8px}
.chkrow{display:flex;gap:8px;align-items:center}.chkrow .chk{flex:1}
.chk{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 12px;text-align:start;min-height:60px;font-weight:600;width:100%}
.chk .box{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.chk .pic{font-size:1.6rem;flex:none}
.chk.on{background:color-mix(in srgb,var(--ok) 10%,var(--surface));border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.chk.on .box{background:var(--ok);border-color:var(--ok);color:#fff}
/* places */
.places{display:flex;flex-direction:column;gap:10px}
.place{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.place .row{grid-column:1/-1}.place .pt{font-size:1.8rem}.place .pm{min-width:0}.place .pm small{display:block;color:var(--muted);font-size:.82rem;word-break:break-word}
.hint{color:var(--muted)}
/* settings */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--surface2);border-radius:12px;min-height:46px;padding:6px 12px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* tabs bar */
#tabs{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#tabs .tin{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#tabs button{border:0;background:none;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;font-weight:700;color:var(--muted);padding:4px 2px}
#tabs button .ic{width:24px;height:24px}
#tabs button[aria-current="true"]{color:var(--ink)}#tabs button[aria-current="true"] .ic{color:var(--sos)}
#speakbar{position:fixed;z-index:25;inset-inline-end:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border:0;border-radius:999px;min-height:52px;padding:0 20px;display:flex;align-items:center;gap:8px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.25)}
#toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:700;max-width:calc(100% - 32px);text-align:center}

<script>
'use strict';
/* ===== CONTENT 1: earthquake, flood, fire. Text arrays are [ar, fr, en, es] ===== */
const S=(e,ar,fr,en,es)=>({e,t:[ar,fr,en,es]});
const TT=(ar,fr,en,es)=>[ar,fr,en,es];
const HZ=[];

HZ.push({id:'quake',ic:'quake',col:'#b45309',n:TT('الزلازل والهزات الأرضية','Séismes','Earthquakes','Terremotos'),
 s:TT('قبل الهزة وأثناءها وبعدها','Avant, pendant et après la secousse','Before, during and after the shaking','Antes, durante y después del temblor'),
 call:['civ','samu'],nowSec:1,
 sec:[
 {t:TT('قبل الزلزال','Avant le séisme','Before an earthquake','Antes del terremoto'),st:[
  S('🔩','ثبّت الخزائن والرفوف الثقيلة في الحائط، وضع الأشياء الثقيلة في الأسفل.','Fixe au mur les armoires et étagères lourdes, range les objets lourds en bas.','Fix heavy cupboards and shelves to the wall, and keep heavy objects low.','Fija a la pared los armarios y estantes pesados y guarda abajo los objetos pesados.'),
  S('🛏️','لا تضع أشياء ثقيلة أو مرايا فوق السرير.','Ne place pas d’objets lourds ni de miroirs au-dessus du lit.','Do not hang heavy objects or mirrors above beds.','No pongas objetos pesados ni espejos encima de la cama.'),
  S('🪑','حدّد في كل غرفة مكانًا آمنًا: تحت طاولة متينة، بعيدًا عن النوافذ.','Repère dans chaque pièce un endroit sûr : sous une table solide, loin des fenêtres.','Find a safe spot in each room: under a sturdy table, away from windows.','Busca en cada habitación un lugar seguro: bajo una mesa firme, lejos de las ventanas.'),
  S('🔧','تعلّم كيف تقطع الغاز والكهرباء والماء من العدادات.','Apprends à couper le gaz, l’électricité et l’eau aux compteurs.','Learn how to shut off gas, electricity and water at the mains.','Aprende a cortar el gas, la electricidad y el agua en los contadores.'),
  S('🎒','جهّز حقيبة الطوارئ واتفق مع العائلة على نقطة تجمّع.','Prépare le sac d’urgence et choisis un point de rassemblement avec ta famille.','Prepare the emergency bag and agree on a meeting point with your family.','Prepara la mochila de emergencia y acuerda un punto de encuentro con tu familia.'),
  S('🧑‍🏫','تدرّبوا في البيت والمدرسة على حركة: انخفض، احتمِ، تمسّك.','Entraînez-vous à la maison et à l’école : se baisser, s’abriter, s’agripper.','Practise at home and at school: Drop, Cover, Hold on.','Practicad en casa y en la escuela: agáchate, cúbrete, agárrate.')]},
 {t:TT('أثناء الهزة: داخل البيت أو المدرسة أو العمل','Pendant la secousse : à la maison, à l’école, au travail','During the shaking: at home, school or work','Durante el temblor: en casa, la escuela o el trabajo'),st:[
  S('⬇️','انخفض فورًا على ركبتيك قبل أن تسقطك الهزة.','Baisse-toi tout de suite sur les genoux avant que la secousse ne te fasse tomber.','Drop onto your hands and knees right away, before the shaking knocks you down.','Agáchate enseguida sobre manos y rodillas antes de que el temblor te tire.'),
  S('🪑','احتمِ تحت طاولة أو مكتب متين، وغطِّ رأسك ورقبتك بذراعيك.','Abrite sous une table ou un bureau solide et protège ta tête et ta nuque avec tes bras.','Take cover under a sturdy table or desk and protect your head and neck with your arms.','Cúbrete bajo una mesa o escritorio firme y protege la cabeza y el cuello con los brazos.'),
  S('✊','تمسّك بالطاولة وابقَ تحتها حتى تتوقف الهزة تمامًا.','Agrippe-toi à la table et reste dessous jusqu’à l’arrêt complet de la secousse.','Hold on to the table and stay under it until the shaking stops completely.','Agárrate a la mesa y quédate debajo hasta que el temblor pare del todo.'),
  S('🧱','إن لم تجد طاولة، اجلس قرب جدار داخلي وغطِّ رأسك، بعيدًا عن النوافذ والخزائن.','Sans table, accroupis-toi contre un mur intérieur, tête protégée, loin des fenêtres et des meubles hauts.','If there is no table, crouch against an inside wall and cover your head, away from windows and tall furniture.','Si no hay mesa, agáchate junto a una pared interior cubriéndote la cabeza, lejos de ventanas y muebles altos.'),
  S('🛏️','إذا كنت في السرير، ابقَ فيه وغطِّ رأسك بالوسادة.','Si tu es au lit, restes-y et protège ta tête avec l’oreiller.','If you are in bed, stay there and cover your head with a pillow.','Si estás en la cama, quédate y cúbrete la cabeza con la almohada.'),
  S('♿','على كرسي متحرك: أوقف العجلات، انحنِ وغطِّ رأسك ورقبتك.','En fauteuil roulant : bloque les roues, penche-toi et protège ta tête et ta nuque.','In a wheelchair: lock the wheels, bend over and protect your head and neck.','En silla de ruedas: frena las ruedas, inclínate y protege la cabeza y el cuello.'),
  S('🏠','ابقَ في الداخل حتى تتوقف الهزة. لا تجرِ نحو الخارج أثناءها.','Reste à l’intérieur jusqu’à la fin de la secousse. Ne cours pas dehors pendant qu’elle dure.','Stay inside until the shaking stops. Do not run outside while it lasts.','Quédate dentro hasta que pare el temblor. No salgas corriendo mientras dura.')]},
 {t:TT('أثناء الهزة: في الشارع أو في السيارة','Pendant la secousse : dans la rue ou en voiture','During the shaking: in the street or in a car','Durante el temblor: en la calle o en el coche'),st:[
  S('🏙️','في الشارع: ابتعد عن المباني والواجهات الزجاجية والأعمدة والأسلاك والأشجار.','Dans la rue : éloigne-toi des bâtiments, des vitrines, des poteaux, des câbles et des arbres.','In the street: move away from buildings, glass fronts, poles, wires and trees.','En la calle: aléjate de edificios, escaparates, postes, cables y árboles.'),
  S('⬇️','في مكان مفتوح، انخفض وغطِّ رأسك حتى تتوقف الهزة.','Dans un endroit dégagé, baisse-toi et protège ta tête jusqu’à la fin de la secousse.','In an open area, drop down and cover your head until the shaking stops.','En un lugar despejado, agáchate y cúbrete la cabeza hasta que pare.'),
  S('🚗','في السيارة: توقّف بهدوء في مكان مفتوح، بعيدًا عن الجسور والأنفاق والمباني والأسلاك.','En voiture : arrête-toi calmement dans un endroit dégagé, loin des ponts, tunnels, bâtiments et câbles.','In a car: stop calmly in an open place, away from bridges, tunnels, buildings and wires.','En el coche: para con calma en un lugar despejado, lejos de puentes, túneles, edificios y cables.'),
  S('🔒','ابقَ داخل السيارة وحزام الأمان مربوط حتى تتوقف الهزة.','Reste dans la voiture, ceinture attachée, jusqu’à la fin de la secousse.','Stay in the car with your seat belt on until the shaking stops.','Quédate en el coche con el cinturón puesto hasta que pare.'),
  S('🌉','بعد ذلك تابع ببطء، وتجنّب الجسور والطرق المتشققة.','Ensuite repars lentement et évite les ponts et les routes fissurées.','Then drive on slowly and avoid bridges and cracked roads.','Después sigue despacio y evita puentes y carreteras agrietadas.'),
  S('🌊','قرب البحر: إذا كانت الهزة قوية أو طويلة، اصعد فورًا إلى مكان مرتفع، فقد يأتي تسونامي.','Près de la mer : si la secousse est forte ou longue, monte tout de suite en hauteur, un tsunami peut arriver.','Near the sea: if the shaking is strong or long, go to high ground at once, a tsunami may follow.','Cerca del mar: si el temblor es fuerte o largo, sube enseguida a un lugar alto, puede llegar un tsunami.')]},
 {t:TT('بعد الهزة','Après la secousse','After the shaking','Después del temblor'),st:[
  S('🔁','توقّع هزات ارتدادية، واحتمِ من جديد إذا عادت الأرض تهتز.','Attends-toi à des répliques et protège-toi de nouveau si le sol tremble encore.','Expect aftershocks and take cover again if the ground shakes.','Espera réplicas y vuelve a cubrirte si el suelo tiembla otra vez.'),
  S('🩹','تفقّد نفسك ومن حولك، وقدّم الإسعافات الأولية إن استطعت.','Vérifie si toi et les personnes autour êtes blessés, et donne les premiers secours si tu peux.','Check yourself and people around you for injuries and give first aid if you can.','Comprueba si tú y quienes te rodean estáis heridos y da primeros auxilios si puedes.'),
  S('🚪','اخرج من المبنى المتضرر بهدوء عبر الدرج، لا تستعمل المصعد.','Sors calmement du bâtiment endommagé par l’escalier, jamais par l’ascenseur.','Leave a damaged building calmly by the stairs, never by the lift.','Sal con calma del edificio dañado por la escalera, nunca en ascensor.'),
  S('👟','البس حذاءً متينًا، فقد يكون الزجاج مكسورًا على الأرض.','Mets des chaussures solides : il peut y avoir du verre cassé.','Put on sturdy shoes: there may be broken glass.','Ponte calzado resistente: puede haber cristales rotos.'),
  S('🔥','لا تشعل عود ثقاب ولا ولّاعة. إذا شممت رائحة الغاز، افتح النوافذ واخرج.','N’allume ni allumette ni briquet. Si ça sent le gaz, ouvre les fenêtres et sors.','Do not light matches or lighters. If you smell gas, open the windows and get out.','No enciendas cerillas ni mecheros. Si huele a gas, abre las ventanas y sal.'),
  S('🏚️','ابتعد عن المباني المتشققة أو المائلة ولا تدخلها لجلب أغراض.','Éloigne-toi des bâtiments fissurés ou penchés et n’y retourne pas chercher des affaires.','Keep away from cracked or leaning buildings and do not go back in for belongings.','Aléjate de edificios agrietados o inclinados y no vuelvas a entrar por tus cosas.'),
  S('⚡','ابتعد عن الأسلاك الكهربائية الساقطة.','Reste loin des câbles électriques tombés.','Stay away from fallen power lines.','Aléjate de los cables eléctricos caídos.'),
  S('📻','استمع إلى الراديو وتعليمات السلطات، واستعمل الرسائل القصيرة بدل المكالمات.','Écoute la radio et les consignes des autorités ; envoie des SMS plutôt que d’appeler.','Listen to the radio and the authorities; send text messages instead of calling.','Escucha la radio y a las autoridades; envía SMS en lugar de llamar.')]},
 {t:TT('إذا كنت عالقًا تحت الأنقاض','Si tu es coincé sous les décombres','If you are trapped under rubble','Si quedas atrapado bajo los escombros'),st:[
  S('🧘','حافظ على هدوئك وتنفّس ببطء. رجال الإنقاذ يبحثون عن الناس.','Garde ton calme et respire lentement. Les secours cherchent les personnes.','Stay calm and breathe slowly. Rescuers are searching for people.','Mantén la calma y respira despacio. Los rescatistas buscan a la gente.'),
  S('😷','غطِّ فمك وأنفك بقطعة قماش أو بثيابك لتتجنّب الغبار.','Couvre ta bouche et ton nez avec un tissu ou tes vêtements contre la poussière.','Cover your mouth and nose with cloth or clothing against the dust.','Cúbrete boca y nariz con un trapo o tu ropa contra el polvo.'),
  S('🔨','اطرق على أنبوب أو جدار بانتظام ليسمعك المنقذون، أو استعمل صفارة.','Tape régulièrement sur un tuyau ou un mur pour que les secours t’entendent, ou utilise un sifflet.','Tap regularly on a pipe or wall so rescuers can hear you, or use a whistle.','Golpea con regularidad una tubería o pared para que te oigan, o usa un silbato.'),
  S('📱','إن كان هاتفك يعمل، أرسل رسالة بمكانك، واقتصد في البطارية.','Si ton téléphone marche, envoie un SMS avec ta position et économise la batterie.','If your phone works, send a text with your location and save the battery.','Si tu móvil funciona, envía un SMS con tu ubicación y ahorra batería.'),
  S('🗣️','لا تصرخ إلا عندما تسمع المنقذين قريبين: الصراخ يُتعبك ويدخل الغبار.','Ne crie que si tu entends les secours tout près : crier épuise et fait respirer la poussière.','Shout only when you hear rescuers close by: shouting tires you and makes you breathe dust.','Grita solo cuando oigas a los rescatistas cerca: gritar cansa y hace respirar polvo.')]}],
 avoid:[
  S('🏃','لا تجرِ نحو الخارج أثناء الهزة: أغلب الإصابات من الأشياء التي تسقط.','Ne cours pas dehors pendant la secousse : la plupart des blessures viennent des chutes d’objets.','Do not run outside during the shaking: most injuries come from falling objects.','No salgas corriendo durante el temblor: la mayoría de heridas vienen de objetos que caen.'),
  S('🛗','لا تستعمل المصعد.','N’utilise pas l’ascenseur.','Do not use the lift.','No uses el ascensor.'),
  S('🔥','لا تشعل نارًا ولا ولّاعة بعد الزلزال (خطر تسرب الغاز).','N’allume pas de flamme après le séisme (risque de fuite de gaz).','Do not light any flame after the quake (gas leak risk).','No enciendas fuego tras el terremoto (riesgo de fuga de gas).'),
  S('🏚️','لا تدخل المباني المتضررة.','N’entre pas dans les bâtiments endommagés.','Do not enter damaged buildings.','No entres en edificios dañados.'),
  S('🪨','إذا كنت عالقًا: لا تحرّك الأنقاض فوقك ولا تُثِر الغبار.','Si tu es coincé : ne bouge pas les décombres au-dessus de toi et ne soulève pas de poussière.','If trapped: do not shift the rubble above you or stir up dust.','Si estás atrapado: no muevas los escombros de encima ni levantes polvo.')]});

HZ.push({id:'flood',ic:'flood',col:'#1d4ed8',n:TT('الفيضانات والسيول','Inondations et crues','Floods and flash floods','Inundaciones y riadas'),
 s:TT('الإخلاء، المياه الجارية، الكهرباء','Évacuation, eau courante, électricité','Evacuation, moving water, electricity','Evacuación, agua en movimiento, electricidad'),
 call:['civ','samu'],nowSec:1,
 sec:[
 {t:TT('قبل الفيضان','Avant l’inondation','Before a flood','Antes de la inundación'),st:[
  S('🗺️','اعرف هل بيتك قريب من وادٍ أو منطقة منخفضة، وأين أقرب مكان مرتفع.','Sache si ta maison est près d’un oued ou en zone basse, et où est le point haut le plus proche.','Know whether your home is near a river or in a low area, and where the nearest high ground is.','Averigua si tu casa está cerca de un río o en zona baja y dónde está el punto alto más cercano.'),
  S('📦','ارفع الوثائق والأجهزة والأشياء الثمينة إلى مكان عالٍ.','Mets les papiers, les appareils et les objets de valeur en hauteur.','Put documents, appliances and valuables up high.','Sube a lo alto los documentos, aparatos y objetos de valor.'),
  S('📻','تابع نشرات الطقس والإنذارات، واشحن هاتفك.','Suis la météo et les alertes, et charge ton téléphone.','Follow weather reports and warnings, and charge your phone.','Sigue el tiempo y las alertas, y carga el móvil.'),
  S('🎒','جهّز حقيبة الطوارئ والأدوية، وحدّد طريق الإخلاء.','Prépare le sac d’urgence et les médicaments, et repère ton itinéraire d’évacuation.','Get the emergency bag and medicines ready and plan your evacuation route.','Prepara la mochila de emergencia y las medicinas y planifica la ruta de evacuación.')]},
 {t:TT('إذا دخل الماء إلى البيت','Si l’eau entre dans la maison','If water gets into the house','Si el agua entra en casa','#'),st:[
  S('⚡','اقطع الكهرباء من العداد فقط إذا كنت في مكان جاف ولا تلمس الماء.','Coupe l’électricité au compteur seulement si tu es au sec et ne touches pas l’eau.','Switch off electricity at the main only if you are dry and not touching water.','Corta la electricidad en el cuadro solo si estás en seco y sin tocar el agua.'),
  S('🔥','أغلق صنبور الغاز.','Ferme le robinet du gaz.','Turn off the gas.','Cierra la llave del gas.'),
  S('⬆️','اصعد إلى الطابق العلوي أو إلى السطح مع حقيبة الطوارئ والهاتف.','Monte à l’étage ou sur le toit avec le sac d’urgence et le téléphone.','Go upstairs or onto the roof with the emergency bag and phone.','Sube al piso de arriba o a la azotea con la mochila de emergencia y el móvil.'),
  S('🚫','لا تحتمِ في قبو أو مكان مغلق قد يمتلئ بالماء.','Ne te réfugie pas dans une cave ni dans un endroit fermé qui peut se remplir.','Never shelter in a basement or closed space that could fill with water.','No te refugies en un sótano ni en un lugar cerrado que pueda llenarse.'),
  S('🏳️','من السطح أو النافذة، لوّح بقطعة قماش ملونة أو بمصباح ليراك المنقذون.','Depuis le toit ou la fenêtre, agite un tissu coloré ou une lampe pour que les secours te voient.','From the roof or a window, wave a bright cloth or a torch so rescuers see you.','Desde la azotea o una ventana, agita una tela de color o una linterna para que te vean.'),
  S('📢','إذا طلبت السلطات الإخلاء، غادر فورًا.','Si les autorités demandent d’évacuer, pars tout de suite.','If the authorities order evacuation, leave immediately.','Si las autoridades ordenan evacuar, sal de inmediato.')]},
 {t:TT('إلى أين تذهب؟','Où aller ?','Where to go','¿Adónde ir?'),st:[
  S('⛰️','اذهب إلى مكان مرتفع وثابت: تلّ، طابق علوي في بناية متينة، أو مركز إيواء.','Va vers un endroit haut et solide : une colline, l’étage d’un bâtiment solide ou un centre d’accueil.','Head for high, solid ground: a hill, an upper floor of a strong building, or a shelter.','Ve a un lugar alto y firme: una colina, un piso alto de un edificio sólido o un albergue.'),
  S('🛣️','اسلك الطرق المعروفة والمرتفعة، وابتعد عن مجاري المياه.','Prends des routes connues et en hauteur, loin des cours d’eau.','Use known, higher roads, away from watercourses.','Toma carreteras conocidas y altas, lejos de los cauces.'),
  S('👨‍👩‍👧','اتجه إلى نقطة التجمّع المتفق عليها، وأخبر عائلتك برسالة.','Rejoins le point de rassemblement convenu et préviens ta famille par SMS.','Go to the agreed meeting point and text your family.','Ve al punto de encuentro acordado y avisa a tu familia por SMS.')]},
 {t:TT('المياه الجارية: لماذا لا تعبرها أبدًا؟','L’eau qui coule : pourquoi ne jamais la traverser','Moving water: why you must never cross it','Agua que corre: por qué nunca cruzarla'),st:[
  S('🦶','15 سنتيمترًا فقط من الماء الجاري تكفي لإسقاط شخص بالغ.','Seulement 15 cm d’eau qui coule suffisent à faire tomber un adulte.','Just 15 cm of moving water can knock an adult off their feet.','Solo 15 cm de agua en movimiento bastan para tirar a un adulto.'),
  S('🚙','30 سنتيمترًا تكفي لرفع سيارة، و60 سنتيمترًا تجرف أغلب السيارات.','30 cm suffisent à soulever une voiture, 60 cm emportent la plupart des véhicules.','30 cm can float a car, and 60 cm sweeps away most vehicles.','30 cm pueden hacer flotar un coche y 60 cm arrastran la mayoría de vehículos.'),
  S('🔙','إذا وجدت طريقًا مغمورًا بالماء: ارجع وابحث عن طريق آخر.','Route inondée ? Fais demi-tour et cherche un autre chemin.','Flooded road? Turn around and find another way.','¿Carretera inundada? Da media vuelta y busca otro camino.'),
  S('🕳️','لا ترى ما تحت الماء: قد تكون الطريق منهارة أو هناك بالوعة مفتوحة.','On ne voit pas sous l’eau : la route peut être effondrée ou une bouche d’égout ouverte.','You cannot see under the water: the road may be gone or a manhole open.','No se ve bajo el agua: la carretera puede haberse hundido o haber una alcantarilla abierta.'),
  S('🚘','إذا توقفت سيارتك والماء يرتفع، اتركها واصعد إلى مكان مرتفع إن كان ذلك آمنًا.','Si ta voiture cale et que l’eau monte, quitte-la et monte en hauteur si c’est sûr.','If your car stalls and the water is rising, leave it and get to high ground if it is safe.','Si el coche se para y el agua sube, déjalo y sube a un lugar alto si es seguro.'),
  S('🪟','إذا جرف الماء السيارة: فكّ الحزام، افتح النافذة، اخرج واصعد فوق السقف.','Si l’eau emporte la voiture : détache la ceinture, ouvre la fenêtre, sors et monte sur le toit.','If water carries the car away: unbuckle, open the window, get out and climb onto the roof.','Si el agua arrastra el coche: suelta el cinturón, abre la ventanilla, sal y sube al techo.')]},
 {t:TT('الكهرباء والماء الملوث','Électricité et eau polluée','Electricity and dirty water','Electricidad y agua contaminada'),st:[
  S('🔌','لا تلمس أي جهاز كهربائي وأنت مبلل أو واقف في الماء.','Ne touche aucun appareil électrique si tu es mouillé ou debout dans l’eau.','Do not touch electrical devices when you are wet or standing in water.','No toques aparatos eléctricos si estás mojado o de pie en el agua.'),
  S('⚡','ابتعد عن الأسلاك الساقطة: الماء ينقل الكهرباء.','Éloigne-toi des câbles tombés : l’eau conduit le courant.','Keep away from fallen wires: water carries electricity.','Aléjate de los cables caídos: el agua conduce la electricidad.'),
  S('🦠','ماء الفيضان ملوث بمياه الصرف والمواد الكيميائية: لا تشربه ولا تلعب فيه.','L’eau d’inondation contient égouts et produits chimiques : ne la bois pas et n’y joue pas.','Floodwater contains sewage and chemicals: do not drink it or play in it.','El agua de la inundación tiene aguas residuales y químicos: no la bebas ni juegues en ella.'),
  S('🚰','اشرب ماء معبّأ أو ماءً مغليًّا فقط حتى تعلن السلطات أن ماء الصنبور آمن.','Ne bois que de l’eau en bouteille ou bouillie tant que les autorités n’ont pas dit que l’eau du robinet est sûre.','Drink only bottled or boiled water until the authorities say tap water is safe.','Bebe solo agua embotellada o hervida hasta que las autoridades digan que la del grifo es segura.'),
  S('🧼','اغسل يديك بالماء النظيف والصابون، وارمِ الطعام الذي لمسه ماء الفيضان.','Lave-toi les mains à l’eau propre et au savon, et jette les aliments touchés par l’eau.','Wash your hands with clean water and soap, and throw away food that touched floodwater.','Lávate las manos con agua limpia y jabón y tira la comida que tocó el agua.')]},
 {t:TT('قرب وادٍ أو قنطرة','Près d’un oued ou d’un pont','Near a river bed or bridge','Cerca de un cauce o un puente'),st:[
  S('⛺','لا تخيّم ولا تركن سيارتك في مجرى وادٍ، حتى لو كان جافًّا.','Ne campe pas et ne te gare pas dans le lit d’un oued, même sec.','Never camp or park in a river bed, even a dry one.','No acampes ni aparques en el cauce de un río, aunque esté seco.'),
  S('🌧️','السيل قد يأتي من أمطار بعيدة في الجبال، والسماء صافية عندك.','La crue peut venir de pluies lointaines en montagne, même sous un ciel bleu chez toi.','A flash flood can come from rain far away in the mountains, even under a clear sky.','La riada puede venir de lluvias lejanas en la montaña, aunque aquí el cielo esté despejado.'),
  S('👂','إذا سمعت هديرًا أو رأيت الماء يرتفع أو يتعكّر بسرعة، اصعد فورًا بعيدًا عن الضفة.','Si tu entends un grondement ou vois l’eau monter ou devenir boueuse, monte tout de suite loin de la rive.','If you hear a roar or see water rising or turning muddy, climb away from the bank at once.','Si oyes un rugido o ves que el agua sube o se enturbia, sube enseguida lejos de la orilla.'),
  S('🌉','لا تعبر قنطرة يغمرها الماء أو يمرّ تحتها سيل قوي.','Ne traverse pas un pont recouvert d’eau ou sous lequel passe une crue violente.','Do not cross a bridge that is under water or above a violent flood.','No cruces un puente cubierto de agua o sobre una riada violenta.'),
  S('👀','لا تقف على الضفة لتتفرّج أو تصوّر: قد تنهار.','Ne reste pas sur la rive pour regarder ou filmer : elle peut s’effondrer.','Do not stand on the bank to watch or film: it can collapse.','No te quedes en la orilla mirando o grabando: puede derrumbarse.')]},
 {t:TT('بعد الفيضان','Après l’inondation','After the flood','Después de la inundación'),st:[
  S('📢','لا ترجع إلى البيت حتى تسمح السلطات بذلك.','Ne rentre chez toi que lorsque les autorités le permettent.','Go home only when the authorities say it is safe.','Vuelve a casa solo cuando las autoridades lo permitan.'),
  S('🏚️','احذر الجدران والأرضيات الضعيفة، ولا تشغّل الكهرباء قبل أن يفحصها مختص.','Attention aux murs et sols fragilisés ; ne remets pas l’électricité avant le contrôle d’un professionnel.','Watch out for weakened walls and floors; do not switch power back on before an electrician checks it.','Cuidado con paredes y suelos debilitados; no vuelvas a dar la luz antes de que lo revise un electricista.'),
  S('🧤','نظّف بقفازات وحذاء مطاطي، وطهّر الأسطح، وهوِّ البيت جيدًا.','Nettoie avec gants et bottes, désinfecte les surfaces et aère bien.','Clean up with gloves and boots, disinfect surfaces and air the house well.','Limpia con guantes y botas, desinfecta las superficies y ventila bien.'),
  S('🐍','انتبه للحيوانات التي جرفها الماء مثل الأفاعي والعقارب.','Attention aux animaux déplacés par l’eau, comme les serpents et les scorpions.','Watch out for animals moved by the water, such as snakes and scorpions.','Cuidado con animales arrastrados por el agua, como serpientes y escorpiones.')]}],
 avoid:[
  S('🌊','لا تعبر المياه الجارية لا مشيًا ولا بالسيارة.','Ne traverse pas l’eau qui coule, ni à pied ni en voiture.','Do not cross moving water, on foot or by car.','No cruces agua en movimiento, ni a pie ni en coche.'),
  S('🔌','لا تلمس الكهرباء وأنت في الماء.','Ne touche pas l’électricité si tu es dans l’eau.','Do not touch electricity while in water.','No toques la electricidad estando en el agua.'),
  S('🏚️','لا تنزل إلى قبو أو مرآب تحت الأرض.','Ne descends pas dans une cave ou un parking souterrain.','Do not go down into a basement or underground car park.','No bajes a un sótano ni a un aparcamiento subterráneo.'),
  S('🚰','لا تشرب ماء الفيضان.','Ne bois pas l’eau de l’inondation.','Do not drink floodwater.','No bebas el agua de la inundación.'),
  S('🏫','لا تذهب لجلب الأطفال من المدرسة إذا طلبت السلطات البقاء في مكانك: المدرسة تهتم بهم.','Ne va pas chercher les enfants à l’école si les autorités demandent de rester sur place : l’école s’en occupe.','Do not go to fetch children from school if told to stay put: the school looks after them.','No vayas a buscar a los niños a la escuela si piden quedarse donde estás: la escuela los cuida.')]});

HZ.push({id:'fire',ic:'fire',col:'#dc2626',n:TT('حرائق الغابات والمنازل','Incendies de forêt et de maison','Wildfires and house fires','Incendios forestales y domésticos'),
 s:TT('الخروج الآمن والدخان','Sortir en sécurité, éviter la fumée','Getting out safely, avoiding smoke','Salir con seguridad y evitar el humo'),
 call:['civ','samu'],nowSec:1,
 sec:[
 {t:TT('الوقاية','Prévenir','Prevention','Prevención'),st:[
  S('🚨','ركّب كاشف دخان وجرّبه كل شهر.','Installe un détecteur de fumée et teste-le chaque mois.','Fit a smoke alarm and test it every month.','Instala un detector de humo y pruébalo cada mes.'),
  S('🧯','احتفظ بمطفأة حريق وبطانية إطفاء في المطبخ.','Garde un extincteur et une couverture anti-feu dans la cuisine.','Keep an extinguisher and a fire blanket in the kitchen.','Ten un extintor y una manta ignífuga en la cocina.'),
  S('🔌','لا تحمّل المقابس فوق طاقتها، وأطفئ الغاز عند مغادرة المطبخ.','Ne surcharge pas les prises et éteins le gaz en quittant la cuisine.','Do not overload sockets and turn off the gas when leaving the kitchen.','No sobrecargues los enchufes y apaga el gas al salir de la cocina.'),
  S('🔥','أبعد الكبريت والولّاعات عن الأطفال.','Range allumettes et briquets hors de portée des enfants.','Keep matches and lighters away from children.','Guarda cerillas y mecheros lejos de los niños.'),
  S('🚪','حدّد مخرجين من كل غرفة ونقطة تجمّع خارج البيت.','Repère deux sorties par pièce et un point de rassemblement dehors.','Know two ways out of every room and a meeting point outside.','Identifica dos salidas por habitación y un punto de encuentro fuera.'),
  S('🌲','في الغابة: لا تشعل نارًا، ولا ترمِ أعقاب السجائر أو الزجاج.','En forêt : n’allume pas de feu et ne jette ni mégots ni verre.','In the forest: do not light fires or throw cigarette ends or glass.','En el bosque: no enciendas fuego ni tires colillas o cristales.')]},
 {t:TT('الخروج بأمان من حريق في البيت','Sortir d’un incendie dans la maison','Getting out of a house fire','Salir de un incendio en casa'),st:[
  S('📣','اصرخ «حريق!» لتنبيه الجميع، واخرج فورًا.','Crie « Au feu ! » pour prévenir tout le monde et sors tout de suite.','Shout “Fire!” to warn everyone and get out at once.','Grita «¡Fuego!» para avisar a todos y sal enseguida.'),
  S('🧎','امشِ منحنيًا أو زاحفًا تحت الدخان: الهواء أنظف قرب الأرض.','Avance baissé ou à quatre pattes sous la fumée : l’air est plus pur près du sol.','Stay low or crawl under the smoke: the air is cleaner near the floor.','Avanza agachado o a gatas bajo el humo: el aire es más limpio cerca del suelo.'),
  S('✋','المس الباب بظهر يدك قبل فتحه. إذا كان ساخنًا، لا تفتحه واستعمل مخرجًا آخر.','Touche la porte avec le dos de la main avant d’ouvrir. Si elle est chaude, n’ouvre pas et prends une autre sortie.','Touch the door with the back of your hand before opening. If it is hot, do not open it; use another exit.','Toca la puerta con el dorso de la mano antes de abrir. Si está caliente, no abras y usa otra salida.'),
  S('🚪','أغلق الأبواب خلفك لتبطئ النار والدخان.','Ferme les portes derrière toi pour ralentir le feu et la fumée.','Close doors behind you to slow the fire and smoke.','Cierra las puertas tras de ti para frenar el fuego y el humo.'),
  S('🛗','استعمل الدرج، أبدًا المصعد.','Prends l’escalier, jamais l’ascenseur.','Use the stairs, never the lift.','Usa la escalera, nunca el ascensor.'),
  S('📞','اتصل بالوقاية المدنية من الخارج، ولا تعد إلى الداخل أبدًا.','Appelle les secours une fois dehors et ne rentre jamais à l’intérieur.','Call the fire service once outside and never go back in.','Llama a los bomberos desde fuera y no vuelvas a entrar nunca.'),
  S('🔄','إذا اشتعلت ثيابك: توقّف، استلقِ على الأرض، غطِّ وجهك وتدحرج.','Si tes vêtements prennent feu : arrête-toi, allonge-toi, couvre ton visage et roule.','If your clothes catch fire: stop, drop to the ground, cover your face and roll.','Si se te prende la ropa: para, tírate al suelo, tápate la cara y rueda.')]},
 {t:TT('الدخان والغازات السامة','Fumée et gaz toxiques','Smoke and toxic gases','Humo y gases tóxicos'),st:[
  S('☠️','الدخان أخطر من النار: بضعة أنفاس منه قد تُفقدك الوعي.','La fumée tue plus que les flammes : quelques bouffées peuvent faire perdre connaissance.','Smoke kills more than flames: a few breaths can make you pass out.','El humo mata más que las llamas: unas pocas inhalaciones pueden hacerte perder el conocimiento.'),
  S('😷','غطِّ أنفك وفمك بقماش، وابقَ منخفضًا، واخرج بسرعة.','Couvre ton nez et ta bouche avec un tissu, reste bas et sors vite.','Cover your nose and mouth with cloth, stay low and get out fast.','Tápate nariz y boca con una tela, mantente abajo y sal rápido.'),
  S('🧻','إذا كنت محاصرًا، ضع مناشف أو ثيابًا مبللة تحت الباب لتسدّ الدخان.','Si tu es bloqué, mets des serviettes ou des vêtements mouillés sous la porte contre la fumée.','If you are trapped, put wet towels or clothes under the door to block smoke.','Si estás atrapado, pon toallas o ropa mojada bajo la puerta para frenar el humo.'),
  S('🌬️','إذا تنفّس شخص الدخان وأصابه سعال أو صداع أو دوار، أخرجه إلى الهواء الطلق واطلب الإسعاف.','Si quelqu’un a respiré de la fumée et tousse, a mal à la tête ou des vertiges, mets-le à l’air libre et appelle les secours.','If someone breathed smoke and is coughing, has a headache or is dizzy, get them to fresh air and call for help.','Si alguien respiró humo y tose, le duele la cabeza o se marea, sácalo al aire libre y pide ayuda.')]},
 {t:TT('ماذا تأخذ إذا كان هناك وقت؟','Quoi emporter si tu as le temps','What to take if there is time','Qué llevar si hay tiempo'),st:[
  S('🎒','حقيبة الطوارئ.','Le sac d’urgence.','The emergency bag.','La mochila de emergencia.'),
  S('💊','الأدوية الضرورية والوصفات.','Les médicaments indispensables et les ordonnances.','Essential medicines and prescriptions.','Las medicinas imprescindibles y las recetas.'),
  S('🪪','الوثائق المهمة (البطاقة، الدفتر العائلي) أو نسخها.','Les papiers importants (identité, livret de famille) ou leurs copies.','Important documents (ID, family records) or copies.','Los documentos importantes (DNI, libro de familia) o sus copias.'),
  S('📱','الهاتف والشاحن وبطارية إضافية.','Le téléphone, le chargeur et une batterie externe.','Phone, charger and a power bank.','El móvil, el cargador y una batería externa.'),
  S('🧥','ملابس طويلة من القطن أو الصوف، وحذاء متين، وكمامة.','Des vêtements longs en coton ou en laine, des chaussures solides et un masque.','Long cotton or wool clothes, sturdy shoes and a mask.','Ropa larga de algodón o lana, calzado resistente y una mascarilla.'),
  S('💧','ماء للشرب.','De l’eau à boire.','Drinking water.','Agua para beber.')]},
 {t:TT('إذا حاصرتك النيران','Si tu es encerclé par le feu','If you are trapped by fire','Si el fuego te rodea'),st:[
  S('🚪','في البيت: ادخل غرفة فيها نافذة، أغلق الباب وسدّ الفتحات بقماش مبلل.','À la maison : va dans une pièce avec fenêtre, ferme la porte et bouche les fentes avec un tissu mouillé.','At home: go into a room with a window, close the door and seal gaps with wet cloth.','En casa: entra en una habitación con ventana, cierra la puerta y tapa las rendijas con tela mojada.'),
  S('🏳️','لوّح من النافذة بقماش أو بمصباح، واتصل وقل بالضبط أين أنت.','Fais signe à la fenêtre avec un tissu ou une lampe, appelle et dis exactement où tu es.','Signal from the window with cloth or a torch, call and say exactly where you are.','Haz señales desde la ventana con una tela o linterna, llama y di exactamente dónde estás.'),
  S('🚗','في السيارة وسط حريق غابة: توقف بعيدًا عن الأشجار، أغلق النوافذ والتهوية، استلقِ وغطِّ نفسك ببطانية.','En voiture dans un feu de forêt : arrête-toi loin de la végétation, ferme vitres et aérations, allonge-toi et couvre-toi d’une couverture.','In a car in a wildfire: stop away from vegetation, close windows and vents, lie down and cover yourself with a blanket.','En el coche en un incendio forestal: para lejos de la vegetación, cierra ventanillas y ventilación, túmbate y cúbrete con una manta.'),
  S('🪨','مشيًا: اذهب إلى مكان بلا نباتات (طريق، صخور، أرض محروثة) واستلقِ على وجهك.','À pied : va vers un endroit sans végétation (route, rochers, champ labouré) et allonge-toi face au sol.','On foot: go to a place with no vegetation (road, rocks, ploughed field) and lie face down.','A pie: ve a un lugar sin vegetación (carretera, rocas, campo arado) y túmbate boca abajo.'),
  S('⛰️','لا تهرب صعودًا نحو قمة التل: النار تصعد بسرعة أكبر.','Ne fuis pas vers le haut de la colline : le feu monte plus vite.','Do not flee uphill: fire climbs faster.','No huyas cuesta arriba: el fuego sube más rápido.')]},
 {t:TT('بعد الحريق','Après l’incendie','After the fire','Después del incendio'),st:[
  S('📢','لا ترجع حتى يسمح رجال الإطفاء أو السلطات.','Ne reviens pas avant l’accord des pompiers ou des autorités.','Do not return until firefighters or authorities allow it.','No vuelvas hasta que lo permitan los bomberos o las autoridades.'),
  S('♨️','احذر الجمر والبقع الساخنة والأشجار المحروقة التي قد تسقط.','Attention aux braises, aux points chauds et aux arbres brûlés qui peuvent tomber.','Beware of embers, hot spots and burnt trees that may fall.','Cuidado con brasas, puntos calientes y árboles quemados que pueden caer.'),
  S('😷','البس كمامة وقفازات عند التنظيف بسبب الرماد.','Porte un masque et des gants pour nettoyer à cause des cendres.','Wear a mask and gloves when cleaning because of the ash.','Usa mascarilla y guantes al limpiar por la ceniza.'),
  S('🍞','ارمِ الطعام والدواء الذي تعرّض للحرارة أو الدخان.','Jette la nourriture et les médicaments exposés à la chaleur ou à la fumée.','Throw away food and medicine exposed to heat or smoke.','Tira la comida y las medicinas expuestas al calor o al humo.'),
  S('🩺','راجع الطبيب إذا استمر السعال أو ضيق التنفس.','Consulte un médecin si la toux ou l’essoufflement continue.','See a doctor if coughing or breathlessness continues.','Ve al médico si siguen la tos o la falta de aire.')]}],
 avoid:[
  S('🔙','لا ترجع إلى الداخل لجلب الأغراض.','Ne retourne pas chercher des affaires.','Do not go back in for belongings.','No vuelvas a entrar por tus cosas.'),
  S('🛗','لا تستعمل المصعد.','N’utilise pas l’ascenseur.','Do not use the lift.','No uses el ascensor.'),
  S('🚪','لا تفتح بابًا ساخنًا.','N’ouvre pas une porte chaude.','Do not open a hot door.','No abras una puerta caliente.'),
  S('💧','لا ترمِ الماء على زيت يحترق أو على جهاز كهربائي: غطِّ القدر بغطاء أو ببطانية.','Ne jette pas d’eau sur de l’huile en feu ou un appareil électrique : couvre la casserole avec un couvercle ou une couverture.','Never throw water on burning oil or electrical equipment: cover the pan with a lid or blanket.','No eches agua sobre aceite ardiendo ni aparatos eléctricos: tapa la sartén con una tapa o una manta.'),
  S('⛰️','لا تهرب صعودًا أمام حريق غابة.','Ne fuis pas vers le haut devant un feu de forêt.','Do not run uphill ahead of a wildfire.','No huyas cuesta arriba ante un incendio forestal.')]});

/* ===== CONTENT 2: storms, cold, heat, landslides ===== */
HZ.push({id:'storm',ic:'storm',col:'#6d28d9',n:TT('العواصف والبرق','Tempêtes et foudre','Storms and lightning','Tormentas y rayos'),
 s:TT('الاحتماء وتجنب المناطق الخطرة','S’abriter et éviter les zones dangereuses','Taking shelter and avoiding danger zones','Refugiarse y evitar zonas peligrosas'),
 call:['civ'],nowSec:1,
 sec:[
 {t:TT('قبل العاصفة','Avant la tempête','Before the storm','Antes de la tormenta'),st:[
  S('📻','تابع نشرات الطقس والإنذارات.','Suis la météo et les alertes.','Follow the weather forecast and warnings.','Sigue el pronóstico y las alertas.'),
  S('🪴','ثبّت أو أدخل الأشياء التي قد يطيّرها الريح (أصص، كراسي، ألواح).','Rentre ou attache ce que le vent peut emporter (pots, chaises, tôles).','Bring in or tie down anything the wind can blow away (pots, chairs, sheets of metal).','Recoge o sujeta lo que el viento pueda llevarse (macetas, sillas, chapas).'),
  S('🔋','اشحن الهاتف، وجهّز مصباحًا وراديو ببطاريات.','Charge le téléphone et prépare une lampe et une radio à piles.','Charge your phone and have a torch and battery radio ready.','Carga el móvil y ten a mano una linterna y una radio de pilas.'),
  S('🚗','أجّل السفر إذا كان هناك إنذار بعاصفة قوية.','Reporte tes déplacements en cas d’alerte de forte tempête.','Postpone travel if a severe storm warning is issued.','Aplaza los viajes si hay alerta de tormenta fuerte.')]},
 {t:TT('أثناء البرق والرعد','Pendant l’orage et la foudre','During thunder and lightning','Durante los truenos y rayos'),st:[
  S('🏠','عندما تسمع الرعد، ادخل فورًا إلى بناية متينة أو سيارة مغلقة السقف.','Dès que tu entends le tonnerre, entre dans un bâtiment solide ou une voiture à toit fermé.','As soon as you hear thunder, get inside a solid building or a hard-roofed car.','En cuanto oigas truenos, entra en un edificio sólido o en un coche de techo rígido.'),
  S('🪟','داخل البيت: ابتعد عن النوافذ، ولا تستحم ولا تلمس الأنابيب أثناء العاصفة.','À l’intérieur : reste loin des fenêtres, ne prends pas de douche et ne touche pas la plomberie pendant l’orage.','Indoors: stay away from windows, do not shower or touch plumbing during the storm.','Dentro: aléjate de las ventanas, no te duches ni toques las tuberías durante la tormenta.'),
  S('🔌','افصل الأجهزة الكهربائية الحساسة.','Débranche les appareils électriques fragiles.','Unplug sensitive electrical devices.','Desenchufa los aparatos eléctricos delicados.'),
  S('🌳','في الخارج: ابتعد عن الأشجار المنعزلة والقمم والأعمدة والأسوار المعدنية والماء.','Dehors : éloigne-toi des arbres isolés, des sommets, des poteaux, des clôtures métalliques et de l’eau.','Outside: keep away from lone trees, hilltops, poles, metal fences and water.','Fuera: aléjate de árboles aislados, cumbres, postes, vallas metálicas y del agua.'),
  S('🧎','إذا لم تجد مأوى: اقرفص منخفضًا، القدمان متلاصقتان، والرأس منحنٍ. لا تستلقِ على الأرض.','Sans abri : accroupis-toi, pieds joints, tête baissée. Ne t’allonge pas par terre.','With no shelter: crouch low, feet together, head down. Do not lie flat on the ground.','Sin refugio: agáchate, pies juntos y cabeza baja. No te tumbes en el suelo.'),
  S('👥','في مجموعة: تفرّقوا بضعة أمتار عن بعضكم.','En groupe : écartez-vous de quelques mètres les uns des autres.','In a group: spread out a few metres apart.','En grupo: separaos unos metros unos de otros.'),
  S('⏱️','انتظر 30 دقيقة بعد آخر رعد قبل الخروج.','Attends 30 minutes après le dernier coup de tonnerre avant de sortir.','Wait 30 minutes after the last thunder before going out.','Espera 30 minutos tras el último trueno antes de salir.')]},
 {t:TT('الرياح القوية','Vents violents','Strong winds','Vientos fuertes'),st:[
  S('🏠','ابقَ في الداخل بعيدًا عن النوافذ والزجاج.','Reste à l’intérieur, loin des fenêtres et des vitres.','Stay indoors, away from windows and glass.','Quédate dentro, lejos de ventanas y cristales.'),
  S('🌳','لا تحتمِ تحت شجرة أو لوحة إعلانية أو جدار ضعيف.','Ne t’abrite pas sous un arbre, un panneau publicitaire ou un mur fragile.','Do not shelter under a tree, billboard or weak wall.','No te refugies bajo un árbol, un cartel o un muro débil.'),
  S('🚗','تجنّب القيادة. إن كنت تقود، خفّف السرعة وأمسك المقود بقوة.','Évite de conduire. Si tu roules, ralentis et tiens fermement le volant.','Avoid driving. If you must, slow down and grip the wheel firmly.','Evita conducir. Si conduces, reduce la velocidad y sujeta bien el volante.'),
  S('⚡','ابتعد عن الأسلاك الكهربائية الساقطة وبلّغ عنها.','Éloigne-toi des câbles tombés et signale-les.','Keep away from fallen power lines and report them.','Aléjate de los cables caídos y avisa.')]}],
 avoid:[
  S('🌳','لا تحتمِ تحت شجرة أثناء البرق.','Ne t’abrite pas sous un arbre pendant l’orage.','Do not shelter under a tree during lightning.','No te refugies bajo un árbol durante la tormenta.'),
  S('🏊','لا تسبح ولا تبقَ قرب الماء.','Ne te baigne pas et ne reste pas près de l’eau.','Do not swim or stay near water.','No te bañes ni te quedes cerca del agua.'),
  S('☂️','لا ترفع أشياء معدنية طويلة (مظلة، عصا) في مكان مفتوح.','Ne lève pas d’objets métalliques longs (parapluie, canne) dans un endroit dégagé.','Do not hold up long metal objects (umbrella, pole) in the open.','No levantes objetos metálicos largos (paraguas, bastón) en campo abierto.'),
  S('⚡','لا تقترب من الأسلاك الساقطة.','Ne t’approche pas des câbles tombés.','Do not go near fallen wires.','No te acerques a cables caídos.')]});

HZ.push({id:'cold',ic:'cold',col:'#0e7490',n:TT('الثلوج والبرد القارس','Neige et grand froid','Snow and extreme cold','Nieve y frío extremo'),
 s:TT('العزلة، التدفئة، وانقطاع الطرق','Isolement, chauffage, routes coupées','Isolation, heating, blocked roads','Aislamiento, calefacción, carreteras cortadas'),
 call:['civ','samu'],nowSec:1,
 sec:[
 {t:TT('الاستعداد','Se préparer','Get ready','Prepárate'),st:[
  S('🥫','خزّن طعامًا وماءً وأدوية لعدة أيام، وحطبًا أو وقودًا للتدفئة.','Stocke nourriture, eau et médicaments pour plusieurs jours, et du bois ou du combustible.','Store food, water and medicines for several days, plus wood or fuel for heating.','Almacena comida, agua y medicinas para varios días, y leña o combustible.'),
  S('🧣','البس عدة طبقات من الملابس، وغطِّ الرأس واليدين والقدمين.','Porte plusieurs couches de vêtements et couvre la tête, les mains et les pieds.','Wear several layers and cover your head, hands and feet.','Lleva varias capas de ropa y cúbrete la cabeza, las manos y los pies.'),
  S('👵','اطمئن يوميًا على الجيران المسنّين ومن يعيشون وحدهم.','Prends chaque jour des nouvelles des voisins âgés ou seuls.','Check every day on elderly neighbours and people living alone.','Pregunta cada día por los vecinos mayores o que viven solos.'),
  S('🚗','لا تسافر إلا للضرورة، وتابع حالة الطرق.','Ne pars en route qu’en cas de nécessité et vérifie l’état des routes.','Travel only if necessary and check road conditions.','Viaja solo si es necesario y consulta el estado de las carreteras.')]},
 {t:TT('التدفئة الآمنة: خطر أول أكسيد الكربون','Se chauffer sans danger : le monoxyde de carbone','Safe heating: carbon monoxide','Calefacción segura: monóxido de carbono'),st:[
  S('☠️','أول أكسيد الكربون غاز قاتل بلا لون ولا رائحة.','Le monoxyde de carbone est un gaz mortel, sans couleur ni odeur.','Carbon monoxide is a deadly gas with no colour or smell.','El monóxido de carbono es un gas mortal, sin color ni olor.'),
  S('🔥','لا تستعمل الكانون (الفحم) أو مدفأة الغاز أو المولّد في غرفة مغلقة، خاصة أثناء النوم.','N’utilise jamais de brasero (charbon), de chauffage au gaz ou de groupe électrogène dans une pièce fermée, surtout la nuit.','Never use a charcoal brazier, gas heater or generator in a closed room, especially while sleeping.','No uses nunca un brasero de carbón, estufa de gas o generador en una habitación cerrada, sobre todo al dormir.'),
  S('🚿','سخان الماء بالغاز يجب أن يكون خارج الحمّام أو في مكان جيد التهوية.','Le chauffe-eau à gaz doit être hors de la salle de bain ou dans un endroit bien aéré.','A gas water heater must be outside the bathroom or in a well-ventilated place.','El calentador de gas debe estar fuera del baño o en un lugar bien ventilado.'),
  S('🌬️','هوِّ البيت 10 دقائق كل يوم، ولا تسدّ فتحات التهوية.','Aère 10 minutes par jour et ne bouche jamais les aérations.','Air the house 10 minutes a day and never block air vents.','Ventila 10 minutos al día y no tapes nunca las rejillas.'),
  S('🤕','صداع، دوار، غثيان، نعاس عند عدة أشخاص معًا؟ افتح النوافذ، اخرجوا، واطلب الإسعاف.','Maux de tête, vertiges, nausées, somnolence chez plusieurs personnes ? Ouvre les fenêtres, sortez et appelle les secours.','Headache, dizziness, nausea or drowsiness in several people? Open windows, get out and call for help.','¿Dolor de cabeza, mareo, náuseas o sueño en varias personas? Abre las ventanas, salid y pide ayuda.')]},
 {t:TT('انخفاض حرارة الجسم وقضمة الصقيع','Hypothermie et gelures','Hypothermia and frostbite','Hipotermia y congelación'),st:[
  S('🥶','علامات انخفاض الحرارة: ارتجاف قوي، كلام متلعثم، ارتباك، نعاس.','Signes d’hypothermie : grands frissons, parole difficile, confusion, somnolence.','Signs of hypothermia: strong shivering, slurred speech, confusion, drowsiness.','Signos de hipotermia: tiritona fuerte, habla torpe, confusión, somnolencia.'),
  S('🛋️','أدخل الشخص إلى مكان دافئ، انزع الملابس المبللة، ولفّه ببطانيات.','Mets la personne au chaud, enlève les vêtements mouillés et enveloppe-la de couvertures.','Get the person somewhere warm, remove wet clothes and wrap them in blankets.','Lleva a la persona a un sitio cálido, quítale la ropa mojada y envuélvela en mantas.'),
  S('☕','إذا كان واعيًا تمامًا، أعطه مشروبًا دافئًا محلّى (ليس كحولًا)، واطلب الإسعاف.','Si elle est bien consciente, donne une boisson chaude sucrée (pas d’alcool) et appelle les secours.','If fully conscious, give a warm sweet drink (no alcohol) and call for help.','Si está bien consciente, dale una bebida caliente azucarada (sin alcohol) y pide ayuda.'),
  S('✋','قضمة الصقيع: جلد أبيض أو رمادي وخدر. دفّئه بحرارة الجسم ولا تدلكه.','Gelure : peau blanche ou grise et engourdie. Réchauffe avec la chaleur du corps, sans frotter.','Frostbite: white or grey numb skin. Warm it with body heat; do not rub it.','Congelación: piel blanca o gris y entumecida. Caliéntala con el calor del cuerpo, sin frotar.')]},
 {t:TT('الطرق المقطوعة والعزلة','Routes coupées et isolement','Blocked roads and isolation','Carreteras cortadas y aislamiento'),st:[
  S('🚙','إذا علقت السيارة في الثلج: ابقَ داخلها، فهي تحميك ويسهل العثور عليك.','Si la voiture est bloquée par la neige : reste dedans, elle te protège et on te trouve plus facilement.','If your car is stuck in snow: stay inside; it protects you and makes you easier to find.','Si el coche queda atrapado en la nieve: quédate dentro; te protege y es más fácil encontrarte.'),
  S('💨','شغّل المحرك 10 دقائق كل ساعة فقط، مع فتح النافذة قليلًا وتنظيف أنبوب العادم من الثلج.','Fais tourner le moteur 10 minutes par heure seulement, fenêtre entrouverte et pot d’échappement dégagé de la neige.','Run the engine only 10 minutes per hour, with a window slightly open and the exhaust pipe clear of snow.','Enciende el motor solo 10 minutos por hora, con la ventanilla algo abierta y el tubo de escape libre de nieve.'),
  S('🧣','علّق قطعة قماش ملونة على السيارة ليراك المنقذون.','Accroche un tissu coloré à la voiture pour que les secours te voient.','Tie a bright cloth to the car so rescuers can see you.','Ata una tela de color al coche para que te vean.'),
  S('📻','في البيت المعزول: اقتصد في الطعام والوقود، واستمع إلى الراديو.','Dans une maison isolée : économise nourriture et combustible, et écoute la radio.','In a cut-off home: ration food and fuel, and listen to the radio.','En una casa aislada: raciona la comida y el combustible y escucha la radio.')]}],
 avoid:[
  S('🔥','لا تتدفأ بالكانون أو الغاز في غرفة مغلقة.','Ne te chauffe pas au brasero ou au gaz dans une pièce fermée.','Do not heat with a brazier or gas in a closed room.','No te calientes con brasero o gas en una habitación cerrada.'),
  S('🍷','لا تشرب الكحول للتدفئة: يزيد فقدان الحرارة.','Ne bois pas d’alcool pour te réchauffer : il fait perdre de la chaleur.','Do not drink alcohol to warm up: it makes you lose heat.','No bebas alcohol para entrar en calor: hace perder calor.'),
  S('🚶','لا تغادر السيارة العالقة لتمشي في العاصفة.','Ne quitte pas la voiture bloquée pour marcher dans la tempête.','Do not leave a stuck car to walk in a storm.','No dejes el coche atrapado para caminar en la tormenta.'),
  S('🖐️','لا تدلك الجلد المتجمد ولا تضعه قرب نار قوية.','Ne frotte pas une peau gelée et ne la mets pas près d’un feu vif.','Do not rub frozen skin or put it near a strong fire.','No frotes la piel congelada ni la acerques a un fuego fuerte.')]});

HZ.push({id:'heat',ic:'heat',col:'#ea580c',n:TT('موجات الحرارة والجفاف','Canicule et sécheresse','Heatwaves and drought','Olas de calor y sequía'),
 s:TT('ضربة الشمس ونقص الماء','Coup de chaleur et manque d’eau','Heatstroke and water shortage','Golpe de calor y escasez de agua'),
 call:['samu'],nowSec:1,
 sec:[
 {t:TT('علامات الإجهاد الحراري','Signes d’épuisement par la chaleur','Signs of heat exhaustion','Signos de agotamiento por calor'),st:[
  S('💦','تعرّق كثير، تعب، دوار، صداع، غثيان، تشنّجات عضلية، جلد بارد ورطب.','Forte transpiration, fatigue, vertiges, maux de tête, nausées, crampes, peau froide et moite.','Heavy sweating, tiredness, dizziness, headache, nausea, cramps, cool clammy skin.','Sudor abundante, cansancio, mareo, dolor de cabeza, náuseas, calambres, piel fría y húmeda.'),
  S('🌳','انقل الشخص إلى مكان بارد أو ظليل، وفكّ ملابسه.','Mets la personne au frais ou à l’ombre et desserre ses vêtements.','Move the person to a cool or shaded place and loosen their clothes.','Lleva a la persona a un lugar fresco o a la sombra y aflójale la ropa.'),
  S('💧','أعطه الماء بجرعات صغيرة، وضع قماشًا مبللًا على جسمه.','Donne de l’eau à petites gorgées et pose des linges mouillés sur son corps.','Give water in small sips and put wet cloths on their body.','Dale agua a sorbos y ponle paños mojados en el cuerpo.'),
  S('⏱️','إذا تقيّأ أو لم يتحسّن خلال ساعة، اطلب الإسعاف.','S’il vomit ou ne va pas mieux en une heure, appelle les secours.','If they vomit or are not better within an hour, call for help.','Si vomita o no mejora en una hora, pide ayuda.')]},
 {t:TT('ضربة الشمس: حالة طارئة','Coup de chaleur : urgence vitale','Heatstroke: a medical emergency','Golpe de calor: urgencia vital'),st:[
  S('🌡️','العلامات: حرارة الجسم مرتفعة جدًا، جلد ساخن أحمر، ارتباك، كلام غير مفهوم، إغماء أو تشنّجات.','Signes : corps très chaud, peau chaude et rouge, confusion, propos incohérents, malaise ou convulsions.','Signs: very high body temperature, hot red skin, confusion, slurred speech, fainting or seizures.','Signos: temperatura corporal muy alta, piel caliente y roja, confusión, habla incoherente, desmayo o convulsiones.'),
  S('📞','اتصل بالإسعاف فورًا.','Appelle les secours immédiatement.','Call emergency services immediately.','Llama a emergencias de inmediato.'),
  S('❄️','برّد الجسم بسرعة: ماء بارد، قماش مبلل، مروحة، وثلج ملفوف على الرقبة والإبطين وبين الفخذين.','Refroidis vite le corps : eau fraîche, linges mouillés, ventilateur, glace enveloppée au cou, aux aisselles et à l’aine.','Cool the body fast: cool water, wet cloths, a fan, and wrapped ice on the neck, armpits and groin.','Enfría el cuerpo rápido: agua fresca, paños mojados, ventilador y hielo envuelto en cuello, axilas e ingles.'),
  S('🚱','لا تعطِه شيئًا ليشربه إذا لم يكن واعيًا تمامًا.','Ne donne rien à boire si la personne n’est pas bien consciente.','Do not give anything to drink if the person is not fully conscious.','No le des nada de beber si no está bien consciente.')]},
 {t:TT('وقاية الأطفال وكبار السن','Protéger enfants et personnes âgées','Protecting children and older people','Proteger a niños y mayores'),st:[
  S('🥤','اشرب الماء بانتظام حتى لو لم تشعر بالعطش. المسنّون لا يشعرون بالعطش جيدًا.','Bois régulièrement même sans soif. Les personnes âgées sentent moins la soif.','Drink regularly even if you are not thirsty. Older people feel thirst less.','Bebe con regularidad aunque no tengas sed. Los mayores sienten menos la sed.'),
  S('☀️','تجنّب الشمس بين 12 و16 ظهرًا، والبس قبعة وملابس خفيفة فاتحة.','Évite le soleil entre 12 h et 16 h, porte un chapeau et des vêtements légers et clairs.','Avoid the sun between 12:00 and 16:00; wear a hat and light, pale clothes.','Evita el sol de 12:00 a 16:00 y usa sombrero y ropa ligera y clara.'),
  S('🚗','لا تترك أبدًا طفلًا أو حيوانًا في سيارة مغلقة، ولو لدقائق.','Ne laisse jamais un enfant ou un animal dans une voiture fermée, même quelques minutes.','Never leave a child or animal in a closed car, even for a few minutes.','No dejes nunca a un niño o animal en un coche cerrado, ni unos minutos.'),
  S('👶','الرضيع: أبقِه في الظل، وأرضعه أكثر، وخفّف ملابسه.','Bébé : garde-le à l’ombre, donne-lui à boire ou allaite plus souvent, habille-le légèrement.','Babies: keep them in the shade, feed them more often and dress them lightly.','Bebés: mantenlos a la sombra, dales de comer más a menudo y vístelos ligeros.'),
  S('🏠','أغلق النوافذ والستائر نهارًا، وافتحها ليلًا عندما يبرد الجو.','Ferme fenêtres et volets le jour, ouvre-les la nuit quand il fait plus frais.','Close windows and shutters during the day, open them at night when it is cooler.','Cierra ventanas y persianas de día y ábrelas de noche cuando refresque.'),
  S('👵','اتصل يوميًا بالمسنّين والمرضى والذين يعيشون وحدهم.','Appelle chaque jour les personnes âgées, malades ou seules.','Call older, sick or isolated people every day.','Llama cada día a las personas mayores, enfermas o solas.')]},
 {t:TT('ترشيد الماء أثناء الندرة','Économiser l’eau en cas de pénurie','Saving water during shortages','Ahorrar agua en la escasez'),st:[
  S('🚿','استحمّ بسرعة وأغلق الصنبور أثناء غسل الأسنان والصابون.','Douche rapide et robinet fermé pendant le brossage des dents et le savonnage.','Take quick showers and turn off the tap while brushing teeth or soaping.','Duchas rápidas y grifo cerrado al cepillarte o enjabonarte.'),
  S('🔧','أصلح كل تسرّب: صنبور يقطر يضيّع لترات كل يوم.','Répare toutes les fuites : un robinet qui goutte gaspille des litres chaque jour.','Fix every leak: a dripping tap wastes litres every day.','Arregla las fugas: un grifo que gotea desperdicia litros cada día.'),
  S('🪣','أعد استعمال ماء غسل الخضر لسقي النباتات أو للمرحاض.','Réutilise l’eau de lavage des légumes pour les plantes ou les toilettes.','Reuse vegetable-washing water for plants or the toilet.','Reutiliza el agua de lavar verduras para las plantas o el inodoro.'),
  S('🫙','خزّن الماء في أوانٍ نظيفة مغلقة، وبعيدًا عن الشمس.','Stocke l’eau dans des récipients propres, fermés et à l’abri du soleil.','Store water in clean, closed containers away from sunlight.','Guarda el agua en recipientes limpios, cerrados y lejos del sol.'),
  S('🥇','الأولوية: الشرب، ثم الطبخ، ثم النظافة.','Priorité : boire, puis cuisiner, puis l’hygiène.','Priority: drinking, then cooking, then hygiene.','Prioridad: beber, luego cocinar, luego la higiene.')]},
 {t:TT('متى تتصل بالإسعاف فورًا؟','Quand appeler les secours tout de suite','When to call emergency services at once','Cuándo llamar a emergencias enseguida'),st:[
  S('😵','فقدان الوعي أو ارتباك أو كلام غير مفهوم.','Perte de connaissance, confusion ou propos incohérents.','Loss of consciousness, confusion or slurred speech.','Pérdida de conocimiento, confusión o habla incoherente.'),
  S('⚡','تشنّجات.','Convulsions.','Seizures.','Convulsiones.'),
  S('🌡️','حرارة مرتفعة جدًا مع جلد ساخن.','Température très élevée avec une peau brûlante.','Very high temperature with hot skin.','Temperatura muy alta con la piel ardiendo.'),
  S('🫁','ضيق في التنفس أو ألم في الصدر.','Difficulté à respirer ou douleur dans la poitrine.','Difficulty breathing or chest pain.','Dificultad para respirar o dolor en el pecho.'),
  S('🥤','عدم القدرة على الشرب أو قيء متكرر.','Impossible de boire ou vomissements répétés.','Unable to drink or repeated vomiting.','No puede beber o vomita repetidamente.')]}],
 avoid:[
  S('☀️','لا تخرج ولا تقم بمجهود بدني تحت الشمس وقت الذروة.','Ne sors pas et ne fais pas d’effort au soleil aux heures chaudes.','Do not go out or exercise in the sun at the hottest hours.','No salgas ni hagas esfuerzos al sol en las horas de más calor.'),
  S('🚗','لا تترك أحدًا في سيارة مغلقة.','Ne laisse personne dans une voiture fermée.','Do not leave anyone in a closed car.','No dejes a nadie en un coche cerrado.'),
  S('🍺','تجنّب الكحول والمشروبات الكثيرة السكر.','Évite l’alcool et les boissons très sucrées.','Avoid alcohol and very sugary drinks.','Evita el alcohol y las bebidas muy azucaradas.'),
  S('🚱','لا تعطِ ماءً لشخص فاقد الوعي.','Ne donne pas d’eau à une personne inconsciente.','Do not give water to an unconscious person.','No des agua a una persona inconsciente.')]});

HZ.push({id:'slide',ic:'slide',col:'#78350f',n:TT('الانهيارات الأرضية','Glissements de terrain','Landslides','Deslizamientos de tierra'),
 s:TT('علامات الخطر والإخلاء','Signes de danger et évacuation','Warning signs and evacuation','Señales de peligro y evacuación'),
 call:['civ'],nowSec:1,
 sec:[
 {t:TT('علامات الخطر في التربة والمنحدرات','Signes de danger dans le sol et les pentes','Warning signs in soil and slopes','Señales de peligro en el suelo y las laderas'),st:[
  S('〰️','شقوق جديدة في الأرض أو الجدران أو الطريق.','Nouvelles fissures dans le sol, les murs ou la route.','New cracks in the ground, walls or road.','Grietas nuevas en el suelo, las paredes o la carretera.'),
  S('🌲','أشجار أو أعمدة أو أسوار تميل فجأة.','Arbres, poteaux ou clôtures qui penchent soudain.','Trees, poles or fences suddenly tilting.','Árboles, postes o vallas que se inclinan de repente.'),
  S('🚪','أبواب ونوافذ أصبحت صعبة الفتح أو الإغلاق.','Portes et fenêtres qui coincent tout à coup.','Doors and windows suddenly sticking.','Puertas y ventanas que de pronto se atascan.'),
  S('💧','ماء يخرج من الأرض، أو سيل موحل مفاجئ، أو تغيّر لون ماء الوادي.','De l’eau qui sort du sol, une coulée de boue soudaine, ou un oued qui devient boueux.','Water seeping from the ground, a sudden muddy stream, or a river turning muddy.','Agua que brota del suelo, una corriente de barro repentina o un río que se enturbia.'),
  S('👂','صوت هدير أو تكسّر يزداد قوة.','Un grondement ou des craquements de plus en plus forts.','A rumbling or cracking sound getting louder.','Un estruendo o crujidos cada vez más fuertes.'),
  S('🌧️','الخطر يكبر بعد أمطار غزيرة أو طويلة أو بعد زلزال.','Le risque augmente après de fortes pluies ou un séisme.','The risk grows after heavy or long rain or after an earthquake.','El riesgo aumenta tras lluvias fuertes o largas o tras un terremoto.')]},
 {t:TT('أثناء الانهيار','Pendant le glissement','During a landslide','Durante el deslizamiento'),st:[
  S('↔️','ابتعد بسرعة عن مسار الانهيار، جانبيًا وليس في اتجاه نزوله.','Écarte-toi vite de la trajectoire, sur le côté et pas dans le sens de la pente.','Move quickly out of its path, sideways and not downhill.','Apártate rápido de su trayectoria, hacia un lado y no cuesta abajo.'),
  S('⛰️','اصعد إلى أرض مرتفعة وثابتة.','Monte vers un terrain haut et stable.','Get to high, stable ground.','Sube a un terreno alto y estable.'),
  S('🛡️','إذا لم تستطع الهروب: انكمش على شكل كرة واحمِ رأسك.','Si tu ne peux pas fuir : mets-toi en boule et protège ta tête.','If you cannot escape: curl into a ball and protect your head.','Si no puedes huir: hazte una bola y protege la cabeza.'),
